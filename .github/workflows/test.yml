name: Test formula

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install formula
        run: brew install --formula ./Formula/actablesite-check.rb
      - name: Run formula test
        run: brew test actablesite-check
      - name: Check a live public robots file
        run: actablesite-check actablesite.com --json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const r = JSON.parse(s); if (r.results.length !== 8) process.exit(1); })'
